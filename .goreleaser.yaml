version: 2

project_name: brabble

builds:
  - id: brabble
    main: ./cmd/brabble
    binary: brabble
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/usr/local/opt/whisper/include -mmacosx-version-min=14.0
      - CGO_LDFLAGS=-L/usr/local/opt/whisper/lib -mmacosx-version-min=14.0 -Wl,-rpath,@executable_path/lib
    goos:
      - darwin
    goarch:
      - arm64

archives:
  - ids:
      - brabble
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
      - src: README.md
      - src: CHANGELOG.md
      - src: .release-libs/*.dylib
        dst: lib

notarize:
  macos:
    - enabled: true
      ids:
        - brabble
      sign:
        certificate: "env:MACOS_SIGNING_P12"
        password: "{{ .Env.MACOS_SIGNING_P12_PASSWORD }}"
        entitlements: .github/macos-entitlements.plist
      notarize:
        issuer_id: "{{ .Env.ASC_ISSUER_ID }}"
        key_id: "{{ .Env.ASC_KEY_ID }}"
        key: "{{ .Env.NOTARY_KEY_FILE }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
